{# The menu: links to the pages. The link of the page that is shown gets the class "active". #}
{% set current = request.url.path %}

<nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">My Expenses</a>
        <ul class="navbar-nav">
            <li class="nav-item {{ 'active' if current == '/dashboard' }}">
                <a class="nav-link" href="/dashboard">Dashboard</a>
            </li>
            <li class="nav-item {{ 'active' if current.startswith('/expense') }}">
                <a class="nav-link" href="/expenses">Expenses</a>
            </li>
        </ul>
    </div>
</nav>
